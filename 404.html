<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 | Harshit Kastwar</title>

<link rel="icon" type="image/png" href="assets/icons/favicon.png">

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Inter;

background:
radial-gradient(circle at 20% 20%,rgba(168,85,247,.15),transparent 30%),
radial-gradient(circle at 80% 50%,rgba(168,85,247,.1),transparent 35%),
#090014;

overflow:hidden;

display:flex;
justify-content:center;
align-items:center;

height:100vh;

color:white;

}

body::before{

content:"";

position:fixed;

width:700px;
height:700px;

top:-250px;
right:-200px;

background:
radial-gradient(
circle,
rgba(168,85,247,.22),
transparent 70%
);

filter:blur(120px);

pointer-events:none;

}

.container{

text-align:center;

z-index:10;

padding:30px;

}

.error{

font-size:140px;
font-weight:800;

color:#fafafa;

line-height:1;

}

.title{

font-size:45px;

margin-top:20px;

font-weight:700;

}

.subtitle{

margin-top:20px;

font-size:24px;

color:#c084fc;

}

.text{

margin-top:20px;

font-size:20px;

opacity:.7;

max-width:600px;

}

a{

display:inline-block;

margin-top:40px;

padding:18px 42px;

border:1px solid #a855f7;

border-radius:50px;

text-decoration:none;

color:white;

transition:.4s;

}

a:hover{

background:#a855f7;

transform:translateY(-3px);

box-shadow:
0 0 30px rgba(168,85,247,.4);

}

.stars{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

pointer-events:none;

z-index:-1;

}

.star{

position:absolute;

width:2px;
height:2px;

background:white;

border-radius:50%;

opacity:.7;

animation:twinkle 3s infinite;

}

@keyframes twinkle{

50%{

opacity:.2;

}

}

</style>

</head>

<body>

<div class="stars">

<span class="star" style="top:10%;left:20%"></span>
<span class="star" style="top:30%;left:60%"></span>
<span class="star" style="top:50%;left:40%"></span>
<span class="star" style="top:70%;left:80%"></span>
<span class="star" style="top:80%;left:15%"></span>
<span class="star" style="top:20%;left:75%"></span>

</div>

<div class="container">

<div class="error">
404
</div>

<div class="title">
Looks like you got lost.
</div>

<div class="subtitle">
Lost in thoughts, found in the wrong page.
</div>

<div class="text">
The page you're looking for doesn't exist,
but there's still a whole world waiting on the homepage.
</div>

<a href="/">
Go Home →
</a>

</div>

</body>

</html>
